<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UNTITLED GAME</title>
<! -- version 1 -- !>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Roboto Mono', sans-serif;
  background: #202161;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.home-container {
  max-width: 400px;
  text-align: center;
}

h1 {
  color: #000000;
  font-weight: 600;
  margin-bottom: 10px;
}

.subtitle {
  color: #000000;
  margin-bottom: 30px;
}

.nav-buttons {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.nav-btn {
  display: block;
  padding: 15px;
  background: #000000;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 18px;
  transition: 0.2s;
}

.nav-btn:hover {
  background: #FFFFFF;
  color: #000000;
}

.fixed-side-image {
  position: fixed;
  left: 20px;
  top: 75px;
  width: 500px;
  z-index: 1000;
}


</style>

</head>
<body>
<img src="X" class="fixed-side-image">

<div class="title-screen">
    <h1>IDK what to name this yet</h1>
    <p class="subtitle">a game for my friends and I to enjoy</p>
<div id="titleScreen">
  <button onclick="joinLobby()" class="nav-btn" >Join Lobby</button>
</div>

<div id="lobbyScreen" style="display: none;">
  <h2>Players in lobby:</h2>
  <ul id="playerList"></ul>
</div>

<div id="gameScreen" style="display: none;">
  <!-- actual game UI -->

</div>
</div>
